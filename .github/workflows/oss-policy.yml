name: OSS policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oss-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify repository policy
        run: python3 .github/oss-policy-check.py
      - name: Verify policy regression tests
        run: cd .github && python3 -m unittest discover -s policy-tests
      - name: Check policy types
        run: |
          python3 -m venv "$RUNNER_TEMP/policy-types"
          "$RUNNER_TEMP/policy-types/bin/pip" install -r .github/policy/requirements.txt
          "$RUNNER_TEMP/policy-types/bin/mypy" --strict .github/policy .github/oss-policy-check.py .github/policy-tests
