name: Dependabot compatible merge
on:
  workflow_run:
    workflows: ["Windows advisor source","OSS policy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Dependabot PR number to evaluate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dependency-merge-${{ github.event.workflow_run.head_branch || github.event.inputs.number || github.run_id }}
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.id == 49699333 &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: zixcel/zixcel-repository-security/.github/actions/dependabot-merge@9adf87acebe1d68abf18f71af9cb1af8e3c96770
        with:
          required-workflows: '["Windows advisor source","OSS policy"]'
          pull-request-number: ${{ github.event.inputs.number || '' }}
