name: Dependabot compatible merge
on:
  workflow_run:
    workflows: ["OSS policy", "Windows advisor source"]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Dependabot PR number to evaluate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dependency-merge-${{ github.event.workflow_run.head_branch || github.event.inputs.number || github.run_id }}
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: zixcel/zixcel-repository-security/.github/actions/dependabot-merge@05bc24e1b7dc3374919a35093e53b3dc66d6ab24
        with:
          pull-request-number: ${{ github.event.inputs.number || '' }}
